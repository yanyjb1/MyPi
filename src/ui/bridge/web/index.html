<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#151517" />
		<title>mypi</title>
		<link rel="stylesheet" href="/webui/css/base.css" />
		<link rel="stylesheet" href="/webui/css/rail.css" />
		<link rel="stylesheet" href="/webui/css/main.css" />
		<link rel="stylesheet" href="/webui/css/panel.css" />
	</head>
	<body data-panel="closed">
		<aside id="rail">
			<div class="head">
				<span class="brand">mypi</span>
				<span class="meta" id="count"></span>
			</div>
			<ol id="rows"></ol>
			<div class="foot">
				<input id="where" placeholder="directory" spellcheck="false" autocomplete="off" />
				<button class="icon" id="new" title="start a session here">+</button>
			</div>
		</aside>

		<main id="main" data-empty="1">
			<header id="topbar">
				<div class="grow" id="title"></div>
				<div id="session-acts"></div>
				<button class="icon" id="panel-toggle" title="panels">☰</button>
			</header>
			<div id="chat">
				<div id="hero">
					<h1>mypi</h1>
					<p>say something to start a session, or pick one on the left</p>
				</div>
				<div class="sheet" id="sheet"></div>
			</div>
			<div id="composer">
				<div class="box">
					<textarea id="say" rows="1" placeholder="say something…" spellcheck="false"></textarea>
					<button class="btn primary" id="send">send</button>
					<button class="btn danger" id="stop" hidden>stop</button>
				</div>
				<div class="queue" id="queue"></div>
			</div>
		</main>

		<aside id="panel">
			<header class="head">
				<nav id="tabs"></nav>
				<button class="icon" id="panel-close" title="close">×</button>
			</header>
			<div class="sheet" id="panel-body"></div>
		</aside>

		<script type="module" src="/webui/js/app.js"></script>
	</body>
</html>
