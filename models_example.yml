# MyPi model configuration — providers, credentials, and pricing.
#
# THIS FILE IS HAND-MAINTAINED. The program never writes it: /model and
# startup bootstrap only ever touch config.yaml. Keep your keys here,
# back this file up, and don't expect mypi to repair it.
#
# Location (XDG):
#   1. $MYPI_MODELS            — explicit override (tests/CI)
#   2. $XDG_CONFIG_HOME/mypi/models.yml  <- put your keys here
#                                             (~/.config/mypi/models.yml)
#
# How to get this file onto your machine (the program will not create it):
#   curl -o ~/.config/mypi/models.yml \
#     https://raw.githubusercontent.com/yanyjb1/MyPi/main/models_example.yml
#
# Pricing is **computed locally**: the gateway only reports how many
# tokens each request used (input / output / cache hits); mypi multiplies
# those counts by the unit prices YOU write here. Fill in your vendor's
# price sheet:
#   - unit prices are per 1M tokens, in the vendor's native currency
#     (`currency` only picks the display symbol ¥/$ — no conversion);
#   - all-zero cost = no price sheet for this model = the statusline
#     hides the spend column entirely.

# ---- Providers -----------------------------------------------------------
# api is REQUIRED. All providers speak an OpenAI-compatible wire protocol;
# the value selects vendor-specific deltas on top:
#   openai-completions — plain OpenAI protocol (default for most gateways)
#   deepseek           — DeepSeek: reasoning_content streams before content
# baseUrl may be written `base_url` — both spellings are accepted.
# api_key: literal string, or a ${ENV_VAR} reference (resolved at load).
providers:
  local:
    api: openai-completions
    baseUrl: http://localhost:7863/v1
    apiKey: ""                       # empty = no auth header
    # Models this provider serves — nested, ids are provider-internal.
    models:
      - id: global:gpt-5.6-luna      # model id sent to the server
        name: GPT5.6L(LC)            # display name (statusline); falls back to id
        contextWindow: 1000000       # statusline ctx-gauge denominator
        maxOutputTokens: 64000       # optional: actual max_tokens per request
        currency: Usd
        cost:
          input: 0.20
          output: 1.20
          cacheRead: 0.02
          cacheWrite: 0.0

      - id: deepseek-ai/DeepSeek-V4.1-Flash
        name: DSV4.1F(MS)
        contextWindow: 1000000
        maxOutputTokens: 128000      # take everything the model allows
        currency: Cny
        cost:
          input: 1
          output: 4
          cacheRead: 0.02
          cacheWrite: 0.0

  vendor:
    api: openai-completions
    baseUrl: https://gateway.example.com:4000/v1
    apiKey: ${VENDOR_API_KEY}        # reference the env var, never commit keys
    models:
      - id: vendor-a/model-x
        name: ModelX(GW)
        contextWindow: 131072
        # maxOutputTokens omitted -> conservative 4096
        # No price sheet for this vendor -> leave all zeros: the
        # statusline hides the spend column for this model.
        currency: Cny
        cost:
          input: 0.0
          output: 0.0
          cacheRead: 0.0
          cacheWrite: 0.0

# ---- What NOT to put here ------------------------------------------------
# default:      -> belongs in config.yaml (mypi writes it there; see /model)
# theme:        -> belongs in config.yaml
