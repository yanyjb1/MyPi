# MyPi model configuration — providers, credentials, and pricing.
#
# THIS FILE IS HAND-MAINTAINED. The program never writes it: /model and
# startup bootstrap only ever touch config.yaml. Keep your keys here,
# back this file up, and don't expect mypi to repair it.
#
# Location — two roots, decided per file:
#   1. 项目根（进程启动目录）:  ./models.yml          <- 有就用它
#   2. 全局根:                 $XDG_CONFIG_HOME/mypi/models.yml
#                              (~/.config/mypi/models.yml)  <- 兜底
# `MYPI_CONFIG_DIR=/some/dir` 把根换成那一个目录：只在它里面找，缺文件直接报错。
# 项目根里放着 models.yml 就意味着**凭据在你的工作目录里**——那个目录如果是
# 版本库，把 models.yml 加进 .gitignore。
#
# How to get this file onto your machine (the program will not create it):
#   curl -o ~/.config/mypi/models.yml \
#     https://raw.githubusercontent.com/yanyjb1/MyPi/main/models_example.yml
#
# Pricing is **computed locally**: the gateway only reports how many
# tokens each request used (input / output / cache hits); mypi multiplies
# those counts by the unit prices YOU write here. Fill in your vendor's
# price sheet:
#   - unit prices are per 1M tokens, in the currency `currency` names; that
#     field says what YOUR numbers mean, nothing about how they are shown;
#   - the display currency and the rate are config.yaml's business:
#     `ui.tui.fx.currency` (CNY or USD) and `ui.tui.fx.usdCny`;
#   - all-zero cost = no price sheet for this model: the pill reads 0.00.

# ---- Providers -----------------------------------------------------------
# Every provider says: baseUrl, api, api_key, models.
#   `api` picks the wire protocol: `openai-completion` or `openai-deepseek`.
#   Anything else fails at startup on purpose — an unknown protocol that
#   silently sent requests would fail as "the model is misbehaving".
#   Omit it and you get `openai-completion`.
# baseUrl may be written `base_url` — both spellings are accepted.
# api_key: literal string, or a ${ENV_VAR} reference (resolved at load).

providers:
  local:
    baseUrl: http://127.0.0.1:1/v1
    api: openai-completion           # the completion dialect
    apiKey: ""                       # empty = no auth header
    # Models this provider serves — nested, ids are provider-internal.
    models:
      - id: local:my-model           # model id sent to the server
        name: My Model               # display name (statusline); falls back to id
        contextWindow: 131072        # required: the ctx gauge's denominator
        maxOutputTokens: 8192        # required: actual max_tokens per request
        currency: Usd
        cost:
          input: 0.20
          output: 1.20
          cacheRead: 0.02
          cacheWrite: 0.0

      - id: vendor-org/model-z
        name: Model Z
        contextWindow: 131072
        maxOutputTokens: 16384       # take everything the model allows
        currency: Cny
        cost:
          input: 1
          output: 4
          cacheRead: 0.02
          cacheWrite: 0.0

  vendor:
    baseUrl: https://gateway.example.com/v1
    apiKey: ${VENDOR_API_KEY}        # reference the env var, never commit keys
    models:
      - id: vendor-a/model-x
        name: Model X
        contextWindow: 131072
        # maxOutputTokens omitted -> the process refuses to start.
        # No price sheet for this vendor -> leave all zeros: the pill reads 0.00.
        currency: Cny
        cost:
          input: 0.0
          output: 0.0
          cacheRead: 0.0
          cacheWrite: 0.0

# ---- What NOT to put here ------------------------------------------------
# default:      -> belongs in config.yaml (mypi writes it there; see /model)
