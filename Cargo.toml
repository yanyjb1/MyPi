[package]
name = "mypi"
version = "0.1.0"
edition = "2024"

[dependencies]
# 同步 HTTP 客户端：极轻、无异步运行时依赖。rustls = 纯 Rust 的 TLS，不依赖系统 OpenSSL
ureq = { version = "3", features = ["rustls", "json", "charset"] }
# 序列化/反序列化：Rust 生态事实标准。derive = 自动为结构体生成 JSON 转换代码
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误处理：省掉手写几百行 Result 样板
anyhow = "1"
serde_yaml = "0.9.34"
unicode-width = "0.2.2"
# SQLite：bundled = 自带 C 源码编译，不依赖系统 libsqlite3
rusqlite = { version = "0.37", features = ["bundled"] }
# Markdown → 事件流解析（pull 式迭代器，映射成 ratatui 的 Span/Line）
pulldown-cmark = "0.13"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
parking_lot = "0.12"
# TUI：终端渲染与键盘/鼠标事件
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# 停止信号（TERM/QUIT/INT/HUP）：还屏后退出。crossterm 已经带着它，这里只是显式声明
signal-hook = "0.3"
# ---- web 工具（内置，不是可选特性）----
# WebSocket（CDP 用）：同步、无 tokio，与 ureq 的风格一致。只做帧协议，
# CDP 的会话/配对逻辑在 src/web/utils/cdp.rs 里手写
tungstenite = "0.30"
# HTML→Markdown：omp 同款 crate（纯 Rust，带 Aggressive 预处理去 nav/footer/form）
html-to-markdown-rs = { version = "3.14", default-features = false }
# 站点规则里的 match 是正则
regex = "1"
# URL 解析（fetch 的 scheme 校验）
url = "2"

