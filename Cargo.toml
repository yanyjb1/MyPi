[package]
name = "mypi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[features]
default = ["web"]
# 浏览器工具族：CDP 客户端、HTML 转 Markdown、URL 解析。没有浏览器的机器用 --no-default-features 编。
web = ["dep:html-to-markdown-rs", "dep:url"]

[dependencies]
# 同步 HTTP 客户端：极轻、无异步运行时依赖。rustls = 纯 Rust 的 TLS，不依赖系统 OpenSSL
ureq = { version = "3", features = ["rustls", "json", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
serde_yaml = "0.9.34"
unicode-width = "0.2.2"
# SQLite：bundled = 自带 C 源码编译，不依赖系统 libsqlite3
rusqlite = { version = "0.37", features = ["bundled"] }
# Markdown → 事件流解析（pull 式迭代器，映射成 ratatui 的 Span/Line）
pulldown-cmark = "0.13"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
parking_lot = "0.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
signal-hook = "0.3"
# ---- web 工具（feature `web`）----
# WebSocket：同步、无 tokio，与 ureq 风格一致。用于 CDP 客户端与 UI bridge。
tungstenite = "0.30"
html-to-markdown-rs = { version = "3.14", default-features = false, optional = true }
base64 = "0.22"
regex = "1"
url = { version = "2", optional = true }
quick-xml = "0.42"
toml = "1"
saphyr = "0.4"
include_dir = "0.7.4"
